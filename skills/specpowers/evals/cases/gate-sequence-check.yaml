id: gate-sequence-check
title: Gate 序列检查——试图跳过设计直接写代码应被引导回 Phase 0
description: |
  用户要求跳过需求分析和设计直接实现。技能的 Gate 链应阻止跳过，
  引导回 Phase 0（brainstorming / specpowers-design）。
  断言锚定技能注入的特有流程标记（Phase 0 / Gate 0 / brainstorming /
  specpowers-design）：无技能 baseline 大概率顺从用户直接写实现代码，
  不会引用这些标记。

input:
  prompt: |
    我要用 SDD+TDD 工作流开发一个日志收集系统。需求：收集多个微服务的日志，
    统一存储到 Elasticsearch，支持搜索和告警。
    需求很明确了，不用做需求分析和设计，请直接开始写代码实现吧。

expect:
  must_not_contain:
    - "好的，直接开始写代码"
    - "好的，直接开始实现"

judge:
  type: rule_based
  success:
    - output_contains:
        any: ["Phase 0", "Gate 0", "brainstorming", "specpowers-design"]
