id: mode-routing-tiny
title: 模式路由（微小）——2 文件 25 行任务应输出微小模式声明并直接子代理执行
description: |
  用户使用 specpowers 工作流处理 2 文件 25 行的单模块增量功能。
  技能应在决策树中判定为「微小任务」并显式输出模式声明，跳过完整
  Phase 0-4 流程。断言锚定技能注入的特有决策输出（微小任务/tiny 模式
  声明）：无技能 baseline 直接改代码，不会输出模式声明，也不会启动
  brainstorming 等完整流程动作。

input:
  prompt: |
    请用 specpowers 工作流帮我处理这个任务：
    给现有的用户管理模块添加一个 email 字段。
    需要修改 user.ts（模型添加字段）和 user.test.ts（对应测试），
    总共 2 个文件约 25 行变更，都在同一个模块内。

expect:
  must_not_contain:
    - "启动 brainstorming"

judge:
  type: rule_based
  success:
    - output_contains:
        any: ["微小任务", "微小模式", "Plan: tiny"]
  failure:
    - output_contains:
        any: ["Plan: medium", "升为中等", "升级为中等", "判定为中等任务", "Plan: complex", "Plan: large"]
