schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code

cases:
  files:
    - evals/cases/mode-routing-tiny.yaml
    - evals/cases/mode-routing-medium.yaml
    - evals/cases/gate-sequence-check.yaml
  defaults:
    timeout_seconds: 300
    max_turns: 8

report:
  formats: [json, html]
