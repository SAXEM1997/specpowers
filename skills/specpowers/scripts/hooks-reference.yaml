# specpowers 可选 hooks 模板（bundled resource）
# ⚠️ 默认不注册——必须复制到 .claude/settings.json 才生效，不会因技能加载自动生效。
# 注：command 中 `<SKILL_BASE>` 为技能基目录占位符（定义见 specpowers 入口技能「脚本路径解析」节）——项目内安装即 `skills/specpowers/`；从 plugins cache 加载时需替换为实际 Base directory（hook command 在项目 cwd 执行，不会自动解析插件缓存路径）。
# 启用后先手动跑一次 `node <替换后路径>/scripts/hook-validate-token.mjs` 验证路径正确（未替换的占位符会 MODULE_NOT_FOUND 且 PreToolUse fail-closed）；复制时与既有 settings.json 合并而非覆盖。
hooks:
  PreToolUse:
    - matcher: 'Write'
      hooks:
        - type: command
          command: 'node <SKILL_BASE>/scripts/hook-validate-token.mjs'
          comment: 'specpowers: 写 .superpowers/.gate-passed-* token 时校验 name 绑定（matcher 限定 Write：Edit 修改已有 token 时 PreToolUse 无法拿完整新内容，故不校验 Edit 路径；state.json 缺失时 fail-open，微小模式不阻断）'
  # 跨 Phase 写入边界检查 hook（较重，每次 Write 触发）——可选扩展，启用前需先实现：
  # PreToolUse:
  #   - matcher: 'Write|Edit'
  #     hooks:
  #       - type: command
  #         command: 'node <SKILL_BASE>/scripts/hook-check-phase-boundary.mjs'
  #         comment: 'specpowers: 检查普通项目文件写入是否越过当前 Phase 边界（未实现）'
