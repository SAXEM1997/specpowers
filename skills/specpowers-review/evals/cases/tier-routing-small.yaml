id: tier-routing-small
title: 小规模代码审查路由——应识别为关键审查
description: |
  specpowers-review 的 tier 路由：微小规模（1-3 文件）代码变更
  应路由到「关键」审查层级。测试路由决策能力。

input:
  prompt: |
    我需要用 specpowers-review 审查一批代码变更。
    变更范围是：2 个文件，约 80 行修改（添加了密码验证逻辑和对应测试）。
    请问这个规模应该用什么审查层级？

expect:
  must_contain:
    - "关键"

judge:
  type: rule_based
  success:
    - output_contains:
        any: ["关键", "critical", "tier=critical"]
