name: provider

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run provider self-check
        run: node scripts/verify-dsh-provider.mjs

  crlf:
    name: verify (CRLF skills)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Convert SKILL.md files to CRLF and assert the conversion
        run: |
          node -e "const fs=require('fs');for(const d of fs.readdirSync('skills')){const p='skills/'+d+'/SKILL.md';const lf=fs.readFileSync(p,'utf8').replace(/\r\n/g,'\n');fs.writeFileSync(p,lf.replace(/\n/g,'\r\n'));if(!fs.readFileSync(p,'utf8').includes('\r\n'))throw new Error('not CRLF: '+p)}"
      - name: Run provider self-check on CRLF copies
        run: node scripts/verify-dsh-provider.mjs
